trigger:
  branches:
    include:
    - main

pool:
  vmImage: 'windows-latest'  # Use Azure-hosted agent, or keep 'Default' for self-hosted

variables:
  buildConfiguration: 'Release'
  dotnetVersion: '8.x'

stages:
- stage: Build
  jobs:
  - job: BuildJob
    steps:
    - task: UseDotNet@2
      inputs:
        packageType: sdk
        version: $(dotnetVersion)

    - task: DotNetCoreCLI@2
      displayName: Restore
      inputs:
        command: restore
        projects: 'quiz4_dotnet/quiz4_dotnet.csproj'  # Fixed path

    - task: DotNetCoreCLI@2
      displayName: Build
      inputs:
        command: build
        projects: 'quiz4_dotnet/quiz4_dotnet.csproj'  # Fixed path
        arguments: '--configuration $(buildConfiguration)'

    - task: DotNetCoreCLI@2
      displayName: Publish
      inputs:
        command: publish
        publishWebProjects: true
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'
        zipAfterPublish: true

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: drop